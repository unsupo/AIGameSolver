[project]
name = "autogameplayer"
version = "0.1.0"
description = "Universal AI Game Player with MCP Server"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "pyboy>=2.7.0",
    "pydantic-settings>=2.13.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "pyboy-advance (>=0.0.2,<0.0.3)",
    "websockets>=16.0",
    "plotly>=6.6.0",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
vision = ["torch>=2.10.0", "torchvision>=0.25.0", "transformers>=5.3.0"]
rl = ["stable-baselines3>=2.3.0", "sb3-contrib>=2.3.0", "gymnasium>=0.29.1"]
dashboard = ["streamlit>=1.55.0", "pandas>=2.3.3"]
llm = ["openai>=2.26.0"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[project.scripts]
nexus = "autogameplayer.runner.single:main"
pool = "autogameplayer.runner.parallel:main"
train = "autogameplayer.core.trainer:main"
run_autogame = "autogameplayer.runner.cli:main"
rl_train = "autogameplayer.core.rl_trainer:main"
llm_coach = "scripts.llm_coach:main"
llm_play = "autogameplayer.runner.llm_turnkey:main"
